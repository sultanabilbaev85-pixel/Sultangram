<!DOCTYPE html>
<html>
<head>
    <title>IME - Вход</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 320px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        .btn { width: 100%; padding: 12px; background: #0088cc; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; }
        a { color: #0088cc; text-decoration: none; font-size: 14px; display: block; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Вход в IME</h2>
        <form method="POST">
            <input type="text" name="username" placeholder="Ваш никнейм" required>
            <input type="password" name="password" placeholder="Пароль" required>
            <button class="btn" type="submit">Войти</button>
        </form>
        <a href="/register">Еще нет аккаунта? Создать</a>
    </div>
</body>
</html>
